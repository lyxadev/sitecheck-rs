[package]
name = "sitecheck-rs"
version = "0.1.0"
edition = "2021"
description = "Fast Rust CLI that audits your website's SEO, meta tags, image alt text and broken links."
license = "MIT"
repository = "https://github.com/lyxadev/sitecheck-rs"
homepage = "https://lyxvo.ai"
readme = "README.md"
keywords = ["seo", "cli", "audit", "links", "website"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "sitecheck"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
